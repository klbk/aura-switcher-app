# On every push: build the apps and run the auto-correction tests (tests/run.sh, tests/run-windows.sh).
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh --release
      - name: Auto-correction test
        run: tests/run.sh -v
      - name: Failures
        if: always()
        run: cat tests/failures.txt || true
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2
        with:
          version: 0.17.0
      - name: Auto-correction test
        run: tests/run-windows.sh -v
      - name: Failures
        if: always()
        run: cat tests/failures.txt || true
