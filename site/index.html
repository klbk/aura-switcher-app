<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURA Switcher</title><meta name="description" content=""><link rel="icon" href="icon.svg">
<style>
:root { --bg:#07080f; --card:rgba(255,255,255,.04); --line:rgba(255,255,255,.09); --text:#f4f5fb; --muted:#9aa0b8; --blue:#3b8cff; --yellow:#ffd500; }
* { box-sizing:border-box; margin:0; }
body { background:var(--bg); color:var(--text); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
html, body { overflow-x:hidden; overflow-x:clip; max-width:100%; }
a { color:inherit; text-decoration:none; }
.wrap { max-width:1120px; margin:0 auto; padding:0 24px; }

/* aurora */
.aurora { position:absolute; inset:-200px 0 auto; height:900px; pointer-events:none; z-index:0; filter:blur(90px); opacity:.55; overflow:hidden; }
.aurora i { position:absolute; border-radius:50%; animation:drift 18s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { width:620px; height:420px; left:10%; top:120px; background:#1d4ed8; }
.aurora i:nth-child(2) { width:520px; height:380px; right:8%; top:60px; background:#7c3aed; animation-delay:-6s; }
.aurora i:nth-child(3) { width:420px; height:300px; left:40%; top:260px; background:#eab308; opacity:.55; animation-delay:-12s; }
@keyframes drift { to { transform:translate(60px,40px) scale(1.15); } }

nav { position:sticky; top:0; z-index:10; backdrop-filter:blur(16px); background:rgba(7,8,15,.6); border-bottom:1px solid var(--line); }
nav .wrap { display:flex; align-items:center; justify-content:space-between; height:64px; }
.brand { display:flex; gap:10px; align-items:center; font-weight:700; letter-spacing:.3px; }
.brand img { width:28px; height:28px; }
.navr { display:flex; gap:10px; align-items:center; }
/* language picker: own popover so it always stays inside the screen */
.langsel { position:relative; }
.langbtn { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); color:var(--text); font:inherit; font-size:14px;
           padding:7px 14px; border-radius:999px; cursor:pointer; }
.langbtn::after { content:"▾"; font-size:11px; color:var(--muted); }
.langlist { position:absolute; top:calc(100% + 8px); inset-inline-end:0; width:min(340px, calc(100vw - 32px)); max-height:min(420px, calc(100vh - 90px));
            overflow:auto; display:none; grid-template-columns:1fr 1fr; gap:2px; padding:8px; border-radius:16px; border:1px solid var(--line);
            background:rgba(16,18,30,.97); backdrop-filter:blur(20px); box-shadow:0 20px 60px rgba(0,0,0,.6); z-index:20; }
.langsel.open .langlist { display:grid; }
.langlist button { text-align:start; background:none; border:0; color:var(--muted); font:inherit; font-size:14px; padding:8px 10px; border-radius:10px; cursor:pointer; }
.langlist button:hover { background:var(--card); color:var(--text); }
.langlist button.on { color:var(--text); background:rgba(59,140,255,.18); font-weight:600; }
.support { margin-top:22px; font-size:15px; color:var(--muted); }
.support a { color:var(--yellow); font-weight:600; }
.btn { display:inline-flex; align-items:center; gap:8px; border-radius:12px; font-weight:600; padding:12px 20px; transition:transform .15s, box-shadow .15s; }
.btn:hover { transform:translateY(-1px); }
.btn.sm { padding:8px 14px; font-size:14px; border-radius:10px; }
.btn.light { background:var(--text); color:var(--bg); box-shadow:0 8px 30px rgba(255,255,255,.15); }
.btn.ghost { border:1px solid var(--line); background:var(--card); }
.btn.coffee { border:1px solid rgba(255,213,0,.45); background:rgba(255,213,0,.08); color:var(--yellow); }
.btn.coffee:hover { background:rgba(255,213,0,.16); box-shadow:0 8px 30px rgba(255,213,0,.15); }

header.hero { position:relative; text-align:center; padding:96px 0 40px; }
header.hero > .wrap { position:relative; z-index:1; }
.badge { display:inline-flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 14px; }
.badge b { width:8px; height:8px; border-radius:50%; background:var(--yellow); box-shadow:0 0 12px var(--yellow); }
h1 { font-size:clamp(42px, 7vw, 84px); line-height:1.02; letter-spacing:-.035em; font-weight:800; margin:24px auto 0; max-width:900px;
     background:linear-gradient(180deg,#fff 30%,#a9b0cc); -webkit-background-clip:text; background-clip:text; color:transparent; }
h1 .hl { background:linear-gradient(90deg,var(--blue),var(--yellow)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.lead { color:var(--muted); font-size:20px; max-width:620px; margin:22px auto 34px; }
.cta { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

/* demo window */
.window { position:relative; z-index:1; max-width:760px; margin:64px auto 0; border-radius:18px; border:1px solid var(--line);
          background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)); box-shadow:0 40px 120px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08); overflow:hidden; }
.menubar { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted); }
.dots { display:flex; gap:7px; } .dots i { width:12px; height:12px; border-radius:50%; background:#2a2d3d; }
.chip { font-weight:800; font-size:12px; border-radius:6px; padding:2px 8px; background:#2a2d3d; color:#fff; transition:.25s; }
.chip.fixed { background:var(--yellow); color:#111; box-shadow:0 0 20px rgba(255,213,0,.5); }
.screen { padding:48px 40px 40px; text-align:start; }
#demoText { font-size:clamp(34px,5vw,54px); font-weight:700; letter-spacing:-.02em; min-height:72px; white-space:nowrap; }
#demoText .wrong { color:#6b7192; } #demoText .right { color:#fff; }
.caret { display:inline-block; width:3px; height:.9em; background:var(--blue); vertical-align:-.1em; margin-left:3px; animation:blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }
#demoStatus { color:var(--muted); font-size:14px; margin-top:10px; min-height:22px; }

section { padding:110px 0 0; }
.h2 { font-size:clamp(30px,4vw,46px); letter-spacing:-.03em; line-height:1.1; font-weight:750; text-align:center; max-width:700px; margin:0 auto 48px; }

/* bento */
.bento { display:grid; grid-template-columns:repeat(6,1fr); gap:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:28px; position:relative; overflow:hidden; }
.card h3 { font-size:20px; letter-spacing:-.01em; margin-bottom:6px; }
.card p { color:var(--muted); font-size:15px; }
.c1 { grid-column:span 3; } .c2 { grid-column:span 3; } .c3, .c4, .c5 { grid-column:span 2; } .c6 { grid-column:span 6; display:flex; align-items:center; justify-content:space-between; gap:24px; }
.vis { height:120px; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:14px; margin-bottom:20px; }
.key { min-width:64px; height:56px; padding:0 18px; border-radius:12px; display:grid; place-items:center; font-weight:700; font-size:18px;
       background:linear-gradient(180deg,#2b2f44,#1b1e2d); border:1px solid rgba(255,255,255,.12); box-shadow:0 4px 0 #0e1019, 0 10px 30px rgba(0,0,0,.4); }
.key.y { color:var(--yellow); } .key.b { color:var(--blue); }
.arrow { color:var(--muted); font-size:24px; }
kbd { font:inherit; font-size:13px; padding:1px 7px; border-radius:6px; border:1px solid var(--line); background:rgba(255,255,255,.06); }
.glow::after { content:""; position:absolute; width:260px; height:260px; border-radius:50%; right:-80px; top:-80px; background:radial-gradient(var(--blue),transparent 70%); opacity:.25; }

.plat { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.plat ul { list-style:none; padding:0; margin-top:14px; color:var(--muted); }
.plat li { padding:8px 0; border-top:1px solid var(--line); }
.plat li::before { content:"✓"; color:var(--yellow); margin-right:10px; font-weight:700; }
.os { font-size:26px; font-weight:750; letter-spacing:-.02em; }

.steps { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; counter-reset:s; }
.steps .card::before { counter-increment:s; content:"0" counter(s); display:block; font-size:44px; font-weight:800; letter-spacing:-.04em; margin-bottom:12px;
                       background:linear-gradient(90deg,var(--blue),var(--yellow)); -webkit-background-clip:text; background-clip:text; color:transparent; }

.final { text-align:center; padding:90px 24px; margin-top:110px; border-radius:28px; border:1px solid var(--line); position:relative; overflow:hidden;
         background:radial-gradient(60% 120% at 50% 0%, rgba(59,140,255,.35), transparent 70%), var(--card); }
.final h2 { font-size:clamp(32px,4.5vw,52px); letter-spacing:-.03em; }
.final p { color:var(--muted); margin:10px 0 28px; font-size:18px; }

footer { padding:64px 0 48px; color:var(--muted); font-size:14px; }
footer .wrap { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
.alt { max-width:820px; margin:0 auto; text-align:center; } .alt h2 { font-size:clamp(24px,3vw,32px); letter-spacing:-.02em; margin-bottom:12px; } .alt p { color:var(--muted); }
.flag { display:inline-block; width:22px; height:15px; border-radius:3px; background:linear-gradient(#0057b7 50%,#ffd500 50%); vertical-align:-2px; margin-right:8px; }
footer strong { color:var(--text); }

@media (max-width:820px) {
  .c1,.c2,.c3,.c4,.c5,.c6 { grid-column:span 6; } .c6 { flex-direction:column; align-items:flex-start; }
  .plat, .steps { grid-template-columns:1fr; } .navr .btn { display:none; } .screen { padding:32px 22px; }
}
@media (prefers-reduced-motion:reduce) { .aurora i { animation:none; } }
</style>
</head>
