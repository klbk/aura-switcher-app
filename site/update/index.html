  const macSteps = [mac1, mac2, `${mac3} <b>${perm}</b>`], winSteps = [win1, win2, win3];
  const steps = win ? winSteps : mac ? macSteps : macSteps.map(s => "macOS — " + s).concat(winSteps.map(s => "Windows — " + s));
  $("howTitle").textContent = sHow;
  $("steps").innerHTML = steps.map(s => `<li>${s}</li>`).join("");
  $("how").hidden = false;
})();
</script>
</body>
</html>
